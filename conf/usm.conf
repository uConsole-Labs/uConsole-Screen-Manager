# ==============================================================================
# uConsole Screen Manager (USM) Configuration File
# Target: ClockworkPi uConsole (CM5) / Raspberry Pi OS Trixie (Wayland / labwc)
#
# After editing this file, apply changes with:
#   usm restart
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Display Switching
# ------------------------------------------------------------------------------

# Key:     USM_MODE
# Type:    string
# Values:  "single" | "dual"
# Default: "single"
# Description:
#   Controls output behavior when an external HDMI display is connected.
#   - "single": Disables the internal DSI-2 display and uses HDMI-A-1 only.
#               (Recommended for daily desktop use and lowest GPU load.)
#   - "dual":   Keeps both internal DSI-2 and external HDMI-A-1 active.
USM_MODE="single"

# Key:     USM_EXT_RES
# Type:    string
# Values:  "<WIDTH>x<HEIGHT>[@<HZ>]" (e.g. "1920x1080@60") or ""
# Default: ""
# Description:
#   Forces a specific resolution/refresh rate on the external HDMI display.
#   Leave empty ("") to automatically select the monitor's EDID preferred mode.
USM_EXT_RES=""

# ------------------------------------------------------------------------------
# 2. Idle Power Management (Screen Off)
# ------------------------------------------------------------------------------

# Key:     USM_IDLE_SCREEN_OFF_TIMEOUT
# Type:    non-negative integer (seconds, decimal without leading zeros)
# Values:  "0" (disabled) or positive integer (e.g. "600" = 10 minutes)
# Default: "600"
# Description:
#   Stage 2 idle timeout before USM turns off active display(s) via swayidle.
#   Only applies when USM manages swayidle (custom non-wlopm swayidle entries
#   in ~/.config/labwc/autostart are never modified).
USM_IDLE_SCREEN_OFF_TIMEOUT="600"

# Key:     USM_HDMI_IDLE_MODE
# Type:    string
# Values:  "no-screen-off" | "disable" | "enable"
# Default: "no-screen-off"
# Description:
#   Controls USM-managed swayidle behavior while an external HDMI monitor is
#   connected (applies to both "single" and "dual" modes):
#   - "no-screen-off": Keeps Stage 1 screensaver (if configured) and disables
#                      Stage 2 screen-off. Recommended default because some
#                      monitors drop HPD during Wayland DPMS standby.
#   - "disable":       Stops swayidle completely while HDMI is connected and
#                      restores it automatically when HDMI is unplugged.
#   - "enable":        Allows normal Stage 2 screen-off even on HDMI. If your
#                      monitor wakes itself or loses signal during DPMS, turn
#                      off "Auto-Switch Input" in the monitor OSD or use
#                      "no-screen-off".
USM_HDMI_IDLE_MODE="no-screen-off"

# ------------------------------------------------------------------------------
# 3. Optional Stage 1 Screensaver (runs before Stage 2 Screen Off)
# ------------------------------------------------------------------------------

# Key:     USM_IDLE_SCREENSAVER_TIMEOUT
# Type:    non-negative integer (seconds, decimal without leading zeros)
# Values:  "0" (disabled) or positive integer smaller than SCREEN_OFF_TIMEOUT
# Default: "0"
# Description:
#   Stage 1 idle timeout before launching USM_IDLE_SCREENSAVER_CMD.
#   Set to "0" to disable the screensaver stage.
USM_IDLE_SCREENSAVER_TIMEOUT="0"

# Key:     USM_IDLE_SCREENSAVER_CMD
# Type:    shell command string
# Values:  Any command string (append "&" for foreground apps), or ""
# Default: ""
# Description:
#   Command executed when Stage 1 screensaver triggers (e.g. "cmatrix &").
#   Has no effect when USM_IDLE_SCREENSAVER_TIMEOUT is "0".
USM_IDLE_SCREENSAVER_CMD=""

# Key:     USM_IDLE_SCREENSAVER_STOP_CMD
# Type:    shell command string
# Values:  Any cleanup command (e.g. "pkill -x cmatrix"), or ""
# Default: ""
# Description:
#   Optional command executed right before Stage 2 turns the screen off, to
#   stop a running Stage 1 screensaver cleanly. Failures are ignored so screen
#   off is never blocked.
USM_IDLE_SCREENSAVER_STOP_CMD=""

# ------------------------------------------------------------------------------
# 4. Audio & System
# ------------------------------------------------------------------------------

# Key:     USM_HDMI_AUDIO_DEFAULT_STATE
# Type:    string
# Values:  "off" | "on" | ""
# Default: "off"
# Description:
#   Default PipeWire HDMI audio profile applied asynchronously at daemon start.
#   - "off": Recommended default. Prevents known CM5 vc4-hdmi kernel crashes
#            during HDMI hotplug while PipeWire holds the audio device open.
#   - "on":  Enables HDMI Digital Stereo automatically (use with caution).
#   - "":    Leaves the current PipeWire HDMI audio profile untouched.
USM_HDMI_AUDIO_DEFAULT_STATE="off"

# Key:     USM_HOOKS_ENABLE
# Type:    boolean string
# Values:  "true" | "false"
# Default: "false"
# Description:
#   When "true", runs executable lifecycle hook scripts in ~/.config/usm/hooks/
#   on daemon start/stop and HDMI plug/unplug events.
USM_HOOKS_ENABLE="false"

# Key:     USM_LOG_ENABLE
# Type:    boolean string
# Values:  "true" | "false"
# Default: "true"
# Description:
#   When "true", appends timestamped runtime logs to ~/.local/state/usm/logs/.
USM_LOG_ENABLE="true"
