# USM Configuration File
# Target OS: Raspberry Pi OS Trixie (Wayland)

# Configuration: USM_MODE
# Type: string
# Range: "single" (turn off internal) or "dual" (keep both on)
USM_MODE="single"

# Configuration: USM_EXT_RES
# Type: string
# Range: Resolution string (e.g. "1920x1080@60"), or "" for automatic
USM_EXT_RES=""      # Example: "1920x1080@60"

# Configuration: USM_EXT_SCALE
# Type: float
# Range: Positive float (e.g. "1.5"), or "" for automatic
USM_EXT_SCALE="1"   # Example: "1.5"

# Configuration: USM_EXT_POS
# Type: string
# Range: X,Y coordinates (e.g. "1920,0"), or "" for automatic
USM_EXT_POS=""      # Example: "1920,0" (X,Y coordinates for dual mode)

# Configuration: USM_HDMI_AUDIO_DEFAULT_STATE
# Type: string
# Range: "off" (recommended to prevent kernel crash), "on", or "" to ignore
USM_HDMI_AUDIO_DEFAULT_STATE="off"

# Configuration: USM_HOOKS_ENABLE
# Type: boolean
# Range: "true" or "false"
USM_HOOKS_ENABLE="false"

# Configuration: USM_LOG_ENABLE
# Type: boolean
# Range: "true" or "false"
USM_LOG_ENABLE="true"

# Configuration: USM_HDMI_DISABLE_SWAYIDLE
# Type: boolean
# Range: "true" or "false"
USM_HDMI_DISABLE_SWAYIDLE="false"

# Configuration: USM_HDMI_DISABLE_SCREEN_OFF
# Type: boolean
# Range: "true" or "false"
# Description: If true, drop the Stage 2 screen-off timeout while an external
# HDMI screen is connected (single and dual mode). The Stage 1 screensaver is
# kept. Default "true" until HDMI idle recovery is proven safe.
USM_HDMI_DISABLE_SCREEN_OFF="true"

# Configuration: USM_ENABLE_HW_POWER_CONTROL
# Type: boolean
# Range: "true" or "false"
# Description: If true, explicitly invoke usm_set_int_screen_power() to force
# fb0 and backlight hardware states. Default false to prevent Wayland DRM lock.
USM_ENABLE_HW_POWER_CONTROL="true"

# Configuration: USM_IDLE_SCREENSAVER_TIMEOUT
# Type: integer (seconds)
# Description: Stage 1 idle timeout for screensaver. Set "0" or "" to disable.
USM_IDLE_SCREENSAVER_TIMEOUT="0"

# Configuration: USM_IDLE_SCREENSAVER_CMD
# Type: string
# Description: Stage 1 screensaver command (append '&' for foreground apps).
USM_IDLE_SCREENSAVER_CMD=""

# Configuration: USM_IDLE_SCREENSAVER_STOP_CMD
# Type: string
# Description: Optional command to stop Stage 1 screensaver before Stage 2
# screen off (e.g. "pkill -x cmatrix"). Empty disables; failures do not block.
USM_IDLE_SCREENSAVER_STOP_CMD=""

# Configuration: USM_IDLE_SCREEN_OFF_TIMEOUT
# Type: integer (seconds)
# Description: Stage 2 idle timeout for screen off. Set "0" or "" to disable.
USM_IDLE_SCREEN_OFF_TIMEOUT="600"

# Configuration: USM_IDLE_SCREEN_OFF_CMD
# Type: string
# Description: Stage 2 custom command. Empty defaults to 'usm-cli.sh idle-off'.
USM_IDLE_SCREEN_OFF_CMD=""

# Configuration: USM_IDLE_SCREEN_ON_CMD
# Type: string
# Description: Stage 3 resume command. Empty defaults to 'usm-cli.sh idle-on'.
USM_IDLE_SCREEN_ON_CMD=""
