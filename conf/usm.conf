# USM Configuration File
# Target OS: Raspberry Pi OS Trixie (Wayland)

# Configuration: USM_MODE
# Type: string
# Range: "single" (turn off internal) or "dual" (keep both on)
USM_MODE="single"

# Configuration: USM_EXT_RES
# Type: string
# Range: Resolution string (e.g. "1920x1080@60"), or "" for automatic
USM_EXT_RES=""      # Example: "1920x1080@60"

# Configuration: USM_EXT_SCALE
# Type: float
# Range: Positive float (e.g. "1.5"), or "" for automatic
USM_EXT_SCALE="1"   # Example: "1.5"

# Configuration: USM_EXT_POS
# Type: string
# Range: X,Y coordinates (e.g. "1920,0"), or "" for automatic
USM_EXT_POS=""      # Example: "1920,0" (X,Y coordinates for dual mode)

# Configuration: USM_HDMI_AUDIO_DEFAULT_STATE
# Type: string
# Range: "off" (recommended to prevent kernel crash), "on", or "" to ignore
USM_HDMI_AUDIO_DEFAULT_STATE="off"

# Configuration: USM_HOOKS_ENABLE
# Type: boolean
# Range: "true" or "false"
USM_HOOKS_ENABLE="false"

# Configuration: USM_LOG_ENABLE
# Type: boolean
# Range: "true" or "false"
USM_LOG_ENABLE="true"

# Configuration: USM_HDMI_DISABLE_SWAYIDLE
# Type: boolean
# Range: "true" or "false"
USM_HDMI_DISABLE_SWAYIDLE="true"
